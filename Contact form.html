<!DOCTYPE html>
<html lang="en">
    <head>
        <h1>Contact Form</h1>
        <body>
            <form action="Contact form.html" method="dialog">
                <p>
                    <label for="name">Fullname</label>
                    <input type="text" id="name" name="name" required>
                    <p>
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required with validation>
                    </p>
                    <p>
                        <label for="tel">Phone</label>
                        <input type="tel" name="tel" name="tel" optional>
                    </p>
                    <p>
                        <label for="subject">
                            <span>Subject</span>
                        </label>
                        <select id="subject" name="subject">
                            <option value="english">English</option>
                            <option value="french">French</option>
                            <option value="swahili">Swahili</option>
                        </select>
                    </p>
                    <label for="message">Message</label>
                    <textarea name="textarea" minlength="50" required>min 50 characters</textarea>
                    <p>
                        <fieldset>
                            <legend>Subscribe to our Newsletter to get Daily Updates</legend>
                            <input type="radio" id="yes" name="yes" />
                            <label for="yes">Yes</label><br />
                            <input type="radio" id="no" name="no" />
                            <label for="yes">No</label><br />
                        </fieldset>
                    </p>
                    <p>
                        <button>Submit</button>
                    </p>
        </body>
    </head>
</html>
